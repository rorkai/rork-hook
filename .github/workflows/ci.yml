name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  swift-package:
    name: Swift Package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Test package
        run: swift test

      - name: Smoke-test client package
        run: Scripts/smoke-client-package.sh
